name: iPhone PWA startup
on:
  push:
    branches: [fix/ios-pwa-renderer]
  workflow_dispatch:
jobs:
  first-frame:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable-iphone
            url: https://aila-scuola.pages.dev/
            device: iPhone
          - name: stable-ipad
            url: https://aila-scuola.pages.dev/
            device: iPad
          - name: beta-iphone
            url: https://beta.aila-scuola.pages.dev/
            device: iPhone
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: bash webApp/tests/ios/smoke.sh "${{ matrix.url }}" "${{ matrix.device }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-${{ matrix.name }}
          path: screen*.png
          if-no-files-found: ignore
