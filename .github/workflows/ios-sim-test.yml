name: iOS simulator keyboard test

# Prova diagnostica: apre la PWA pubblicata in Safari su un simulatore iPhone (macOS), tocca un campo
# di testo con tocchi veri (Appium + XCUITest) e controlla se compare la tastiera. Non pubblica nulla.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Indirizzo della PWA'
        required: false
        default: 'https://aila-scuola.pages.dev/'

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Find a simulator
        id: sim
        run: |
          set -e
          xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available \
            | sed -n '/^-- iOS 2[6-9]/,/^--/p' \
            | grep -m1 'iPhone' \
            | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}')
          if [ -z "$UDID" ]; then
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          PV=$(xcrun simctl list devices available | awk -v u="$UDID" '/^-- iOS/ {v=$3} index($0,u) {print v; exit}')
          DN=$(xcrun simctl list devices available | grep -m1 "$UDID" | sed 's/ (.*//' | sed 's/^ *//')
          echo "platform_version=$PV" >> "$GITHUB_OUTPUT"
          echo "device_name=$DN" >> "$GITHUB_OUTPUT"
          echo "Versione iOS: $PV, dispositivo: $DN"
          xcrun simctl list devices | grep "$UDID"

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

      - name: Install Appium
        run: |
          npm install -g appium@latest
          appium driver install xcuitest
          mkdir -p "$RUNNER_TEMP/t" && cd "$RUNNER_TEMP/t" && npm init -y >/dev/null && npm install webdriverio@9 >/dev/null

      - name: Start Appium
        run: |
          nohup appium --port 4723 --log-level warn > "$RUNNER_TEMP/appium.log" 2>&1 &
          sleep 8
          curl -s http://127.0.0.1:4723/status | head -c 300

      - name: Run test
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          PLATFORM_VERSION: ${{ steps.sim.outputs.platform_version }}
          DEVICE_NAME: ${{ steps.sim.outputs.device_name }}
          BASE_URL: ${{ inputs.base_url || 'https://aila-scuola.pages.dev/' }}
        run: |
          cp .github/ci/ios-sim-test.mjs "$RUNNER_TEMP/t/ios-sim-test.mjs"
          cd "$RUNNER_TEMP/t"
          node ios-sim-test.mjs

      - name: Appium log (errori e coda)
        if: always()
        run: |
          grep -n "error:" "$RUNNER_TEMP/appium.log" | tail -n 40 || true
          echo ------
          tail -n 60 "$RUNNER_TEMP/appium.log" || true
