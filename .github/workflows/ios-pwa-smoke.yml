name: iPhone PWA startup
on:
  push:
    branches: [fix/ios-pwa-renderer]
  workflow_dispatch:
jobs:
  first-frame:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        startup: [normal, refuse-gradient]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: bash webApp/tests/ios/smoke.sh https://aila-scuola.pages.dev/ ${{ matrix.startup }}
