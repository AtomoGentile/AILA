<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>AILA</title>
    <meta name="description" content="Circolari, bacheca, calendario e mappa posti della classe." />
    <meta name="theme-color" content="#16204A" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AILA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <script src="startup.js?v=2" async></script>
    <link rel="stylesheet" href="styles.css?v=2" />
    <script src="perf-debug.js" defer></script>
    <script src="ios-keyboard.js?v=11" defer></script>
    <script id="aila-app-script" src="aila.js?boot=3" defer></script>
  </head>
  <body>
    <!-- Schermata di avvio: resta finche' Compose non disegna il primo fotogramma. -->
    <div id="aila-splash">
      <div class="mark">AILA</div>
      <noscript><p class="startup-text">JavaScript è disattivato. Attivalo nelle impostazioni del browser per aprire AILA.</p></noscript>
      <p id="diagnosi-avvio" class="startup-text" role="status">Pagina caricata. Attendo lo script di avvio.</p>
      <div id="aila-startup-recovery">
        <p>L’avvio sta impiegando più del previsto.</p>
        <p id="aila-startup-error" role="status" hidden></p>
        <a id="aila-startup-retry" href="./">Riprova</a>
      </div>
    </div>
  </body>
</html>
