name: iOS Build

on:
  push:
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - '.github/workflows/ios-build.yml'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - '.github/workflows/ios-build.yml'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle wrapper and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Select Xcode with iOS 26 SDK
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          # Firebase (firebase-ios-sdk) e' un pacchetto grosso da risolvere/clonare: senza
          # cache ogni run lo riscarica da zero, aggiungendo diversi minuti.
          key: ${{ runner.os }}-spm-${{ hashFiles('iosApp/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd iosApp
          xcodegen generate

      - name: Find an available iOS simulator
        id: sim
        run: |
          set -e
          # Un dispositivo iPhone gia' creato sul runner, sul runtime iOS 26 (deve essere
          # 26+: FoundationModels non esiste prima). Solo comandi di testo (grep/sed), niente
          # script multi-riga incorporato nel blocco YAML: un python -c multilinea qui dentro
          # aveva rotto la sintassi YAML del workflow (indentazione del blocco letterale).
          UDID=$(xcrun simctl list devices available \
            | sed -n '/^-- iOS 26/,/^--/p' \
            | grep -m1 'iPhone' \
            | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}')
          if [ -z "$UDID" ]; then
            echo "Nessun simulatore iPhone su iOS 26 disponibile sul runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulatore scelto: $UDID"
          xcrun simctl list devices | grep "$UDID"

      - name: Build iOS app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot simulator and smoke-test the app launch
        # "xcrun simctl bootstatus -b" può restare bloccato per ore su alcuni runner (bug
        # noto dei runner macOS ospitati, soprattutto quando xcodebuild ha già avviato da
        # solo il simulatore come parte della build con destinazione concreta): un timeout
        # esplicito trasforma un blocco silenzioso in un fallimento chiaro e veloce, invece
        # di consumare le 6 ore di timeout massimo del job.
        timeout-minutes: 10
        run: |
          set -e
          UDID="${{ steps.sim.outputs.udid }}"
          echo "Stato del simulatore prima del boot:"
          xcrun simctl list devices | grep "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Circolare+.app" -path "*Debug-iphonesimulator*" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Circolare+.app non trovata nella DerivedData"
            exit 1
          fi
          echo "App: $APP_PATH"

          xcrun simctl install "$UDID" "$APP_PATH"

          # "simctl launch" stampa "bundle.id: PID" su stdout. I processi delle app nel
          # simulatore girano come normali processi HOST (macOS), non come job di launchd:
          # il PID stampato qui e' interrogabile direttamente con kill -0 sul runner, senza
          # passare da "simctl spawn ... launchctl list" (che lista servizi di sistema, non
          # le app in foreground, e quindi non trovava mai nulla - falso allarme di crash
          # nella versione precedente di questo step).
          # stdout/stderr dell'app su file: un'eccezione Kotlin non gestita (che fa SIGABRT)
          # scrive il suo messaggio e lo stack solo li', non nel log di sistema.
          APP_OUT="$RUNNER_TEMP/app-stdout.txt"
          APP_ERR="$RUNNER_TEMP/app-stderr.txt"
          LAUNCH_OUTPUT=$(xcrun simctl launch --stdout="$APP_OUT" --stderr="$APP_ERR" "$UDID" com.circolareplus)
          echo "$LAUNCH_OUTPUT"
          APP_PID=$(echo "$LAUNCH_OUTPUT" | grep -oE '[0-9]+$')
          if [ -z "$APP_PID" ]; then
            echo "Impossibile leggere il PID dall'output di 'simctl launch'"
            exit 1
          fi

          # Da' all'app qualche secondo per completare l'avvio (init Kotlin/Compose,
          # iniezione dei bridge nativi) prima di controllare se e' ancora viva: e' il
          # controllo piu' diretto che abbiamo per un crash all'avvio senza un Mac vero.
          sleep 8

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "App avviata (PID $APP_PID) e ancora in esecuzione dopo 8s."
          else
            echo "L'app (PID $APP_PID) non risulta piu' in esecuzione."
            # Perché è uscita: il log dell'app da solo non lo dice (un'app uccisa dal sistema non
            # scrive nulla). Il motivo lo registrano runningboardd/SpringBoard/FrontBoard, e un
            # crash vero lascia un report in DiagnosticReports sul Mac che ospita il simulatore.
            echo "::group::Motivo della chiusura (runningboard, SpringBoard, FrontBoard)"
            xcrun simctl spawn "$UDID" log show --last 3m --style compact \
              --predicate "eventMessage CONTAINS 'circolareplus' OR eventMessage CONTAINS '$APP_PID'" 2>/dev/null \
              | grep -iE 'termin|kill|watchdog|exit|crash|reason|jetsam|signal|assertion|timeout|timed out' \
              | grep -v 'BackgroundTask' | tail -80 || true
            echo "::endgroup::"
            echo "::group::stderr dell'app (eccezioni Kotlin non gestite)"
            tail -c 20000 "$APP_ERR" 2>/dev/null || echo "(vuoto)"
            echo "::endgroup::"
            echo "::group::stdout dell'app"
            tail -c 6000 "$APP_OUT" 2>/dev/null || echo "(vuoto)"
            echo "::endgroup::"
            # Il crash report (.ips) lo scrive ReportCrash qualche secondo dopo la chiusura.
            sleep 15
            echo "::group::Crash report"
            find ~/Library/Logs/DiagnosticReports -newer "$APP_PATH" \( -name '*Circolare*' -o -name '*iosApp*' \) 2>/dev/null \
              | while read -r f; do echo "== $f"; head -c 12000 "$f"; echo; done
            echo "::endgroup::"
            echo "::group::Ultimo minuto del log dell'app"
            xcrun simctl spawn "$UDID" log show --predicate 'process == "Circolare+"' --last 1m --style compact \
              | grep -v BackgroundTask | tail -60 || true
            echo "::endgroup::"
            exit 1
          fi

          xcrun simctl shutdown "$UDID" || true
