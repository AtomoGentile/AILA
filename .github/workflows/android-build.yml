name: Android Build

# Compila il codice Kotlin di :shared e :androidApp per Android. Nessun test a schermo: serve a
# scoprire subito un errore di compilazione, dato che non tutti gli ambienti di sviluppo
# riescono a scaricare le dipendenze da Google Maven.

on:
  push:
    paths:
      - 'shared/**'
      - 'androidApp/**'
      - '.github/workflows/android-build.yml'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    paths:
      - 'shared/**'
      - 'androidApp/**'
      - '.github/workflows/android-build.yml'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle wrapper and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # google-services.json non e' nel repository (.gitignore): il plugin Google Services lo
      # richiede per configurare il modulo, quindi in CI se ne scrive uno finto con lo stesso
      # package. Non serve a far funzionare le notifiche, solo a compilare.
      - name: Placeholder google-services.json
        run: |
          if [ ! -f androidApp/google-services.json ]; then
            cat > androidApp/google-services.json <<'EOF'
          {
            "project_info": { "project_number": "0", "project_id": "ci-placeholder", "storage_bucket": "ci-placeholder.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:0:android:0000000000000000", "android_client_info": { "package_name": "com.circolareplus" } },
              "api_key": [{ "current_key": "ci-placeholder" }]
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Compile Kotlin (shared + androidApp)
        run: ./gradlew --no-daemon :shared:compileDebugKotlinAndroid :androidApp:compileDebugKotlinAndroid

      - name: Shared unit tests
        run: ./gradlew --no-daemon :shared:testDebugUnitTest
