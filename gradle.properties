android.useAndroidX=true
android.enableJetifier=true
org.gradle.configuration-cache=true

# Memoria del demone Gradle. Senza questa riga il demone parte con i 512 MB di default e la
# fusione dei file dex (task mergeExtDexDebug) fallisce con un "Error while merging dex archives"
# privo di messaggio: e' un OutOfMemoryError dentro D8, non un errore del codice. Il progetto
# porta gia' i segni del problema, i file java_pid*.hprof nella cartella principale.
# Con l'AI locale la cosa peggiora — MediaPipe si trascina Guava e protobuf — quindi la memoria
# va alzata esplicitamente.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Ignora i target Kotlin/Native disabilitati (utile per compilare il progetto su macchine
# diverse senza dover commentare i target iOS/Android ad ogni commit).
kotlin.native.ignoreDisabledTargets=true
