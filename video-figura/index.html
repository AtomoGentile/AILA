<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AILA — Fig. 1</title>
<style>
@font-face{font-family:Sora;font-weight:300;src:url(../video-trailer/fonts/sora-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:Sora;font-weight:400;src:url(../video-trailer/fonts/sora-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Sora;font-weight:500;src:url(../video-trailer/fonts/sora-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Sora;font-weight:600;src:url(../video-trailer/fonts/sora-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Sora;font-weight:700;src:url(../video-trailer/fonts/sora-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Sora;font-weight:800;src:url(../video-trailer/fonts/sora-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:"Geist Mono";font-weight:400;src:url(fonts/geist-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:"Geist Mono";font-weight:500;src:url(fonts/geist-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:"Geist Mono";font-weight:600;src:url(fonts/geist-mono-latin-600-normal.woff2) format('woff2')}

:root{
  --bg:#08090B; --line:226,232,245; --acc:#93A4FF; --acc-rgb:147,164,255;
  --sans:Sora,system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);
  font-family:var(--sans);color:#fff;transform-origin:0 0;-webkit-font-smoothing:antialiased}
#cv{position:absolute;left:0;top:0}

/* ---------- la figura: riquadro con la scena e le scritte sopra ---------- */
#frame{position:absolute;left:40px;top:40px;width:1840px;height:1000px;overflow:hidden}
#frame > *{position:absolute}
.lab{font:500 20px/1 var(--mono);color:rgba(255,255,255,.82);white-space:nowrap}
.caps{font:500 17px/1 var(--mono);letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.46);white-space:nowrap}
#fig{left:28px;top:26px}
#ver{right:28px;top:28px}
#stl{left:28px;bottom:26px}
#stl b{font-weight:500;color:rgba(255,255,255,.86)}
#str{right:28px;bottom:25px;font:400 19px/1 var(--mono);color:rgba(255,255,255,.78);white-space:nowrap}

/* numero grande in alto a sinistra */
#ro{left:28px;top:70px}
#ro .l{font:500 16px/1 var(--mono);letter-spacing:.26em;color:rgba(255,255,255,.44);white-space:nowrap}
#ro .v{display:flex;align-items:baseline;gap:14px;margin-top:14px;white-space:nowrap}
#ro .n{font:500 96px/1 var(--sans);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
#ro .u{font:400 30px/1 var(--sans);color:rgba(255,255,255,.52)}

/* didascalia collegata a un punto della scena */
#co{left:0;top:0;width:560px}
#co .h{display:flex;align-items:baseline;gap:16px;white-space:nowrap}
#co .num{font:500 19px/1 var(--mono);color:var(--acc);letter-spacing:.04em}
#co .ttl{font:500 40px/1.1 var(--sans);letter-spacing:-.022em}
#co .desc{margin-top:14px;font:400 23px/1.42 var(--sans);color:rgba(255,255,255,.64)}
#co .data{margin-top:16px;font:400 18px/1.5 var(--mono);letter-spacing:.05em;color:rgba(255,255,255,.9);white-space:nowrap}
#co .data i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 9px 1px 0;vertical-align:middle}
#co .data span{margin-right:22px}

/* etichette piccole agganciate a punti della scena */
.tag{left:0;top:0;font:400 17px/1 var(--mono);letter-spacing:.03em;color:#fff;white-space:nowrap;will-change:transform}
.tag > div{transform:translate(-50%,-100%);padding:8px 11px 9px;border:1.5px solid rgba(255,255,255,.3);border-radius:7px;background:rgba(8,9,11,.84)}
.tag.acc > div{border-color:var(--acc)}
.tag.sm{font-size:14.5px;letter-spacing:.08em}
.tag.sm > div{padding:6px 8px 7px;border-radius:6px}
.tag em{font-style:normal;color:var(--acc)}
.tag s{text-decoration:none;color:rgba(255,255,255,.5)}

/* chiusura */
#end{left:0;top:0;width:100%;height:100%}
#end > *{position:absolute}
#logo{left:330px;top:328px;width:300px;height:300px}
#wm{left:712px;top:352px;font:700 190px/1 var(--sans);letter-spacing:-.05em}
#tg{left:722px;top:552px;font:400 37px/1.2 var(--sans);color:rgba(255,255,255,.72);white-space:nowrap}
#pl{left:724px;top:626px;font:500 17px/1 var(--mono);letter-spacing:.26em;color:rgba(255,255,255,.5);white-space:nowrap}
#pl b{font-weight:500;color:var(--acc)}

/* anteprima nel browser (nascosta durante l'esportazione) */
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:14px;align-items:center;padding:10px 16px;background:rgba(0,0,0,.7);
  font:14px system-ui,sans-serif;color:#ccc;z-index:10}
#ui input{flex:1}
#ui button{font:inherit;padding:4px 12px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="frame">
    <div id="fig" class="lab">Fig 1</div>
    <div id="ver" class="caps">AILA · 1.0.0</div>
    <div id="ro"><div class="l"></div><div class="v"><span class="n"></span><span class="u"></span></div></div>
    <div id="co"><div class="h"><span class="num"></span><span class="ttl"></span></div><div class="desc"></div><div class="data"></div></div>
    <div id="stl" class="caps"></div>
    <div id="str"></div>
    <div id="end"><div id="logo"></div><div id="wm">AILA</div><div id="tg">L’app per la vita di classe</div><div id="pl"></div></div>
  </div>
</div>
<div id="ui"><button id="play">Pausa</button><span id="tm">0.0 s</span><input id="seek" type="range" min="0" max="60" step="0.01" value="0"></div>
<script src="timeline.js"></script>
<script src="figura.js"></script>
</body>
</html>
