# JDK con cui Gradle esegue la build di questo progetto.
#
# Perche' esiste questo file: .idea/gradle.xml imposta gradleJvm = #GRADLE_LOCAL_JAVA_HOME, che
# e' la macro con cui Android Studio dice "il JDK sta scritto in gradle/config.properties". Il
# file pero' non c'era, quindi Studio si fermava con
# "Undefined java.home on the project gradle/config.properties file".
#
# Punta al JDK incorporato in Android Studio (JBR 21): e' quello con cui la build e' stata
# verificata da riga di comando, ed e' abbastanza recente per AGP 8.13, che richiede almeno il 17.
#
# Barre in avanti e non backslash: in un file .properties il backslash e' un carattere di escape e
# andrebbe raddoppiato. Java accetta le barre in avanti anche su Windows.
#
# ATTENZIONE: e' un file specifico di questa macchina, come local.properties. Se il progetto
# finisce sotto controllo di versione va escluso, altrimenti rompe la build di chiunque abbia
# Android Studio installato altrove.
java.home=C:/Program Files/Android/Android Studio/jbr
