name: iOS IPA (SideStore)

# IPA non firmata per SideStore: la firma la fa SideStore sul dispositivo con l'Apple ID gratuito.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - '.github/workflows/ios-ipa.yml'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: write # serve solo per allegare l'IPA alla release sui tag

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle wrapper and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-ipa-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Select Xcode with iOS 26 SDK
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('iosApp/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd iosApp
          xcodegen generate

      # Release per dispositivo reale, senza firma (niente account a pagamento).
      - name: Build Release for iphoneos
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package AILA.ipa
        run: |
          set -e
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Nessuna .app trovata in Release-iphoneos"
            exit 1
          fi
          echo "App: $APP_PATH"
          rm -rf Payload AILA.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          # Controllo rapido: le chiavi del refresh in background devono esserci.
          /usr/libexec/PlistBuddy -c "Print :BGTaskSchedulerPermittedIdentifiers" Payload/*.app/Info.plist
          zip -qry AILA.ipa Payload
          ls -lh AILA.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AILA-ipa
          path: AILA.ipa
          if-no-files-found: error

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AILA.ipa
