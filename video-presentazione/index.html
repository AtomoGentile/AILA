<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AILA — Presentazione</title>
<style>
@font-face{font-family:Sora;font-weight:300;src:url(fonts/sora-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:Sora;font-weight:400;src:url(fonts/sora-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Sora;font-weight:500;src:url(fonts/sora-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Sora;font-weight:600;src:url(fonts/sora-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Sora;font-weight:700;src:url(fonts/sora-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Sora;font-weight:800;src:url(fonts/sora-latin-800-normal.woff2) format('woff2')}

:root{
  --blue:#3B82F6; --violet:#8B5CF6; --cyan:#06B6D4; --teal:#14B8A6; --indigo:#6366F1;
  --green:#10B981; --amber:#F59E0B; --slate:#94A3B8;
  --pgreen:#22C55E; --pyellow:#EAB308; --plred:#F87171; --pdred:#DC2626;
  --ink:#EEF2FF; --muted:#A9B5DA; --faint:#6E7AA3;
  --grad:linear-gradient(95deg,#7AB0FF 0%,#A78BFA 55%,#5EEAD4 100%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#060B1C;
  font-family:Sora,system-ui,sans-serif;color:var(--ink);transform-origin:0 0;-webkit-font-smoothing:antialiased}
.scene,.layer{position:absolute;inset:0}
.a{position:absolute}
.w{display:inline-block;will-change:transform}
.w.em,.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ico{display:inline-block;width:1em;height:1em;flex:none}
.ico svg{width:100%;height:100%;display:block}

/* sfondo */
.blob{position:absolute;width:1100px;height:1100px;border-radius:50%;left:0;top:0}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(170,190,255,.10) 1.2px,transparent 1.3px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55) 100%)}

/* testi */
.label{display:inline-flex;align-items:center;gap:14px;font-size:22px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:#B9C4FF;padding:11px 22px;border-radius:999px;border:1px solid rgba(165,180,252,.35);background:rgba(99,102,241,.14);white-space:nowrap}
.label b{font-weight:800;color:#fff}
.h1{font-size:80px;line-height:1.08;font-weight:700;letter-spacing:-.025em;margin:0}
.hxl{font-size:100px;line-height:1.08;font-weight:700;letter-spacing:-.03em;margin:0}
.sub{font-size:32px;line-height:1.45;font-weight:400;color:var(--muted)}
.center{text-align:center}

/* superfici */
.glass{background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.13);
  border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.chip{display:inline-flex;align-items:center;gap:12px;font-size:24px;font-weight:500;padding:14px 22px;border-radius:999px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);white-space:nowrap}
.chip .ico{width:28px;height:28px;color:#9DB6FF}

/* scena 1: notifiche */
.notif{width:600px;padding:20px 24px;border-radius:26px;display:flex;gap:18px;align-items:center;
  background:rgba(22,28,54,.82);border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.notif .ic{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;flex:none}
.notif .ic .ico{width:30px;height:30px;color:#fff}
.notif .app{font-size:17px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between}
.notif .app span{text-transform:none;letter-spacing:0;font-weight:400;color:var(--faint)}
.notif .tx{font-size:23px;font-weight:600;line-height:1.3;margin-top:4px;color:#F1F4FF}

/* telefono (tema chiaro dell'app) */
.phone{width:430px;height:900px;border-radius:66px;background:#0B1022;padding:12px;
  box-shadow:0 0 0 2px rgba(255,255,255,.16),0 50px 140px rgba(0,0,0,.65),0 0 120px rgba(99,102,241,.25)}
.screen{position:relative;width:100%;height:100%;border-radius:55px;overflow:hidden;
  background:radial-gradient(circle at 15% 8%,#E3E9FF 0,transparent 45%),radial-gradient(circle at 90% 70%,#EDE6FF 0,transparent 50%),#F5F6FC;color:#1A1C22}
.island{position:absolute;left:50%;top:14px;width:118px;height:34px;margin-left:-59px;background:#000;border-radius:20px;z-index:5}
.sbar{position:absolute;left:34px;right:30px;top:18px;display:flex;justify-content:space-between;font-size:17px;font-weight:600;color:#111}
.lt-card{position:absolute;left:18px;right:18px;background:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 6px 18px rgba(30,40,90,.08);border:1px solid rgba(20,30,80,.05)}
.lt-meta{font-size:14px;color:#74777F;font-weight:500}
.lt-title{font-size:18px;font-weight:600;line-height:1.3;margin-top:8px;color:#1A1C22}
.badge{position:absolute;right:16px;top:13px;font-size:13px;font-weight:600;padding:5px 10px 5px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.badge i{width:8px;height:8px;border-radius:50%;display:inline-block}
.b-green{background:#ECFDF5;color:#047857}.b-green i{background:#10B981}
.b-amber{background:#FFFBEB;color:#B45309}.b-amber i{background:#F59E0B}
.b-gray{background:#F1F5F9;color:#475569}.b-gray i{background:#94A3B8}
.b-scan{background:#EEF2FF;color:#4F46E5}
.b-scan .ico{width:14px;height:14px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;background:rgba(255,255,255,.86);border-top:1px solid rgba(20,30,80,.07);
  display:flex;justify-content:space-around;align-items:flex-start;padding-top:16px}
.tabbar .ico{width:27px;height:27px;color:#8E929C}
.tabbar .on .ico{color:#3B82F6}

/* chat */
.bubble{position:absolute;font-size:24px;line-height:1.45;padding:18px 24px;border-radius:26px}
.bu{right:34px;max-width:560px;background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;border-bottom-right-radius:8px}
.ba{left:34px;width:640px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-bottom-left-radius:8px}
.caret{display:inline-block;width:3px;height:1.05em;background:#9DB6FF;vertical-align:-0.15em;margin-left:2px;border-radius:2px}
.src{display:inline-flex;align-items:center;gap:10px;font-size:20px;font-weight:600;color:#C9D6FF;padding:10px 16px;border-radius:14px;
  background:rgba(59,130,246,.16);border:1px solid rgba(125,160,255,.35);white-space:nowrap}
.src .ico{width:22px;height:22px}

/* calendario */
.cell{position:absolute;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06)}
.cell .d{position:absolute;left:14px;top:10px;font-size:21px;font-weight:600;color:#DCE3FF}
.cell.out .d{color:#4B5578}
.cell.today{border:2px solid #5A8CFF;background:rgba(59,130,246,.12)}
.ev{position:absolute;left:10px;right:10px;font-size:15px;line-height:1.2;font-weight:600;padding:6px 9px;border-radius:10px;
  border-left:4px solid;display:flex;align-items:center;gap:6px}
.ev .ico{width:15px;height:15px;flex:none}

/* sondaggi */
.vote{position:absolute;height:138px;width:400px;border-radius:24px;padding:22px 26px;display:flex;gap:20px;align-items:center}
.vote .dot{width:62px;height:62px;border-radius:50%;flex:none;box-shadow:0 0 30px currentColor}
.vote .nm{font-size:27px;font-weight:600}
.vote .pt{font-size:22px;color:var(--muted);margin-top:4px}
.vote .pt b{color:#fff;font-weight:700}
.dcol{position:absolute;width:255px;height:330px;border-radius:26px;padding:22px}
.dcol .dn{font-size:28px;font-weight:700}
.dcol .dm{font-size:19px;color:var(--muted);margin-top:2px}
.slot{position:absolute;width:76px;height:76px;border-radius:50%;border:2px dashed rgba(255,255,255,.18)}
.av{position:absolute;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:25px;font-weight:700;color:#fff;
  box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.25);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.stamp{position:absolute;right:18px;top:18px;width:58px;height:58px;border-radius:50%}
.ptfly{position:absolute;font-size:30px;font-weight:800}

/* mappa posti */
.desk{position:absolute;width:250px;height:86px;border-radius:20px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12)}
.seat{position:absolute;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff;
  box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.28);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.factor{position:absolute;left:0;width:660px;height:92px;display:flex;align-items:center;gap:22px}
.factor .fi{width:70px;height:70px;border-radius:20px;display:grid;place-items:center;flex:none;background:rgba(99,102,241,.16);border:1px solid rgba(165,180,252,.3)}
.factor .fi .ico{width:34px;height:34px;color:#B5C3FF}
.factor .ft{font-size:26px;font-weight:600;line-height:1.25}
.factor .fs{font-size:20px;color:var(--muted);margin-top:3px}
.factor .fp{margin-left:auto;font-size:24px;font-weight:800;padding:8px 14px;border-radius:12px;white-space:nowrap}
.pos{color:#4ADE80;background:rgba(34,197,94,.13)} .neg{color:#FCA5A5;background:rgba(239,68,68,.14)} .neu{color:#C4B5FD;background:rgba(139,92,246,.16)}

/* bacheca */
.prop{position:absolute;width:860px;border-radius:26px;padding:24px 30px}
.prop .pt1{font-size:19px;color:var(--muted);display:flex;align-items:center;gap:10px}
.prop .pt2{font-size:30px;font-weight:600;margin-top:10px;line-height:1.25}
.prop .pf{display:flex;align-items:center;gap:26px;margin-top:18px;font-size:22px;color:var(--muted)}
.prop .pf span{display:inline-flex;align-items:center;gap:9px}
.prop .pf .ico{width:24px;height:24px}
.status{position:absolute;right:26px;top:22px;font-size:18px;font-weight:700;padding:8px 16px;border-radius:999px;white-space:nowrap}
.rk{position:absolute;left:30px;right:30px;height:82px}
.rk .bar{position:absolute;left:0;top:0;bottom:0;border-radius:18px}
.rk .nm{position:absolute;left:22px;top:0;bottom:0;display:flex;align-items:center;gap:16px;font-size:25px;font-weight:600}
.rk .nm i{font-style:normal;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:19px;font-weight:700}
.rk .vl{position:absolute;right:22px;top:0;bottom:0;display:flex;align-items:center;font-size:24px;font-weight:700}

/* anteprima */
#ui{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#0d1226;color:#cdd6ff;font:14px Sora,sans-serif}
#ui button{background:#3B82F6;color:#fff;border:0;border-radius:8px;padding:8px 14px;font:600 14px Sora,sans-serif;cursor:pointer}
#ui input{flex:1}
body.capture #ui{display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui"><button id="play">Pausa</button><span id="tm">0.0 s</span><input id="seek" type="range" min="0" max="148" step="0.01" value="0"></div>
<script src="icons.js"></script>
<script src="timeline.js"></script>
<script src="video.js"></script>
</body>
</html>
