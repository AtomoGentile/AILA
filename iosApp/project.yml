name: iosApp
options:
  deploymentTarget:
    iOS: "26.0"
  bundleIdPrefix: com.circolareplus

packages:
  # Firebase Messaging via Swift Package Manager (non CocoaPods): resta coerente con lo
  # scheletro XcodeGen-only gia' in uso, senza dover generare un .xcworkspace separato.
  # FirebaseMessaging usa FirebaseCore internamente ma FirebaseApp.configure() va chiamato
  # esplicitamente da AppDelegate.swift, quindi serve anche come dipendenza diretta.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  # MLX Swift (Tier 2 AI locale, iPhone senza Apple Intelligence). Le librerie riusabili
  # (MLXLLM/MLXLMCommon) sono state spostate da mlx-swift-examples a questo repo dedicato
  # (confermato con una ricerca web il 20/9/2026; i vecchi URL di mlx-swift-examples restano
  # validi ma puntano qui). `branch: main` invece di un numero di versione perché questo
  # ambiente non ha un Mac per verificare quale tag sia compatibile con Xcode/iOS 26 al momento
  # della build — la prima build reale dovrebbe passare a un tag fisso una volta verificato.
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    branch: main

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      # GoogleService-Info.plist, quando presente in questa cartella, viene raccolto
      # automaticamente da questo glob come risorsa dell'app (bundle). In CI non c'e'
      # (locale, vedi .gitignore, come google-services.json per Android): xcodegen non
      # fallisce se manca, semplicemente non lo trova e non lo include.
      - path: iosApp
    info:
      path: iosApp/Info.plist
    settings:
      PRODUCT_NAME: Circolare+
      PRODUCT_BUNDLE_IDENTIFIER: com.circolareplus
      FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
      OTHER_LDFLAGS: -framework shared
      # shared/build.gradle.kts non dichiara iosX64 (simulatore Mac Intel): Compose Multiplatform
      # ha smesso di pubblicare per quel target. Senza questa esclusione Xcode chiede comunque
      # x86_64 per il simulatore (default ARCHS = arm64 x86_64) e Gradle fallisce con
      # "Xcode Requested Architecture Not Configured in Gradle: ios_x64".
      EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseCore
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
    preBuildScripts:
      - name: Embed and Sign Apple Framework
        script: |
          cd "$SRCROOT/.."
          chmod +x ./gradlew
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
