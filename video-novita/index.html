<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AILA — Novità: PWA e sezione Gita</title>
<link rel="stylesheet" href="../video-trailer/common.css">
<style>
/* I titoli e l'app usano Inter (taglio "Display" alle dimensioni grandi); Sora resta solo per il nome AILA. */
@font-face{font-family:Inter;font-weight:100 900;src:url(fonts/inter-latin-opsz-normal.woff2) format('woff2')}
@font-face{font-family:Sora;font-weight:800;src:url(../video-trailer/fonts/sora-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Sora;font-weight:700;src:url(../video-trailer/fonts/sora-latin-700-normal.woff2) format('woff2')}
:root{
  --gw:linear-gradient(92deg,#6FA8FF 0%,#A78BFA 52%,#5EEAD4 100%);   /* parte web, su nero */
  --gg:linear-gradient(92deg,#FF8A1F 0%,#F0457A 50%,#7C4DFF 100%);   /* parte gita, su chiaro */
}
#stage{background:#000;font-family:Inter,system-ui,sans-serif;font-optical-sizing:auto;color:#F5F5F7;--tx:#F5F5F7;--mut:#A1A1A6;
  text-rendering:geometricPrecision}
.scene{--tx:#F5F5F7;--mut:#A1A1A6;color:var(--tx)}
.scene.lt{--tx:#1D1D1F;--mut:#6E6E73}
.cam{position:absolute;inset:0;transform-origin:50% 50%}
.curtain{position:absolute;left:0;right:0;top:0;height:1140px}
.glow{position:absolute;border-radius:50%;pointer-events:none}

/* tipografia */
.hero-t{font-size:150px;font-weight:680;letter-spacing:-.044em;line-height:1.02;white-space:nowrap}
.h{font-size:86px;font-weight:670;letter-spacing:-.04em;line-height:1.05}
.h.c{font-size:82px;text-align:center;white-space:nowrap}
.sub{font-size:31px;font-weight:470;letter-spacing:-.014em;line-height:1.4;color:var(--mut)}
.eye{display:inline-flex;align-items:center;gap:14px;font-size:30px;font-weight:650;letter-spacing:-.012em;white-space:nowrap}
.eye .ico{width:32px;height:32px}
.gt{background:var(--g,var(--gw));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.12em;margin-bottom:-.12em}
.ln{display:block;white-space:nowrap}
.cap{font-size:23px;font-weight:560;letter-spacing:-.008em;color:var(--mut);white-space:nowrap;text-align:center}
.cap b{color:var(--tx);font-weight:650}

/* l'app: carattere di sistema, come su iPhone */
.app{font-family:Inter,sans-serif}
.app .nm,.app .sh .t{letter-spacing:-.02em}
.scene.lt .dev .frame{background:linear-gradient(145deg,#3A3F4E,#14171F 40%,#262B38);
  box-shadow:0 0 0 2px rgba(0,0,0,.28),inset 0 0 0 2px rgba(255,255,255,.08),0 60px 110px rgba(60,50,90,.26),0 18px 36px rgba(60,50,90,.14)}
.tap{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(120,140,255,.38);
  box-shadow:0 0 0 2px rgba(255,255,255,.7);z-index:60;pointer-events:none}

/* finestra del browser */
.bw{position:relative;width:1240px;height:812px;border-radius:26px;background:#1B1B1E;overflow:hidden;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.14),0 90px 180px rgba(0,0,0,.75),0 0 140px rgba(90,120,255,.12)}
.bw .tb{position:absolute;left:0;right:0;top:0;height:62px;display:flex;align-items:center;padding:0 24px;gap:10px;background:#29292D}
.bw .tb i{width:13px;height:13px;border-radius:50%;background:#5B5B62;display:block}
.bw .url{position:absolute;left:50%;top:12px;width:560px;height:38px;margin-left:-280px;border-radius:12px;background:#18181B;
  display:flex;align-items:center;justify-content:center;gap:9px;font-size:17px;font-weight:500;color:#EDEDF2;letter-spacing:-.005em}
.bw .url .ico{width:15px;height:15px;color:#8E8E93}
.bw .prog{position:absolute;left:0;top:60px;height:3px;background:linear-gradient(90deg,#5A8CFF,#A78BFA);z-index:5}
.bw .view{position:absolute;left:0;right:0;top:62px;bottom:0;background:#1B1B1E}

/* Safari sul telefono, foglio di condivisione, schermata Home */
.saf-page{position:absolute;left:0;right:0;top:0;height:786px;overflow:hidden}
.saf-bar{position:absolute;left:12px;right:12px;bottom:20px;height:56px;display:flex;gap:9px;align-items:center;z-index:30}
.saf-bar .rb{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none;color:#0A66E8;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.72));border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 28px rgba(20,30,80,.18)}
.saf-bar .rb .ico{width:23px;height:23px}
.saf-bar .pill{flex:1;height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:560;color:#111;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.72));border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 28px rgba(20,30,80,.18)}
.saf-bar .pill .ico{width:14px;height:14px;color:#8E8E93}
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:36px 36px 0 0;background:#F2F2F7;z-index:40;box-shadow:0 -20px 60px rgba(10,15,50,.25);color:#111}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:rgba(60,60,67,.3);margin:9px auto 0}
.shrow{display:flex;align-items:center;gap:14px;height:56px;padding:0 18px;font-size:16.5px;font-weight:500;position:relative}
.shrow+.shrow{border-top:1px solid rgba(60,60,67,.12)}
.shrow .ico{width:22px;height:22px;color:#3C3C43;margin-left:auto}
.hsic{position:absolute;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.hsic .ico{width:30px;height:30px}
.hslb{position:absolute;width:84px;margin-left:-10px;text-align:center;font-size:11.5px;font-weight:560;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}

/* schermata Gita */
.bar{position:absolute;left:16px;right:16px;top:58px;height:44px;display:flex;align-items:center;gap:12px}
.rbtn{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--cardB);box-shadow:var(--cardSh);display:grid;place-items:center;flex:none;color:var(--ink)}
.rbtn .ico{width:20px;height:20px}
.rbtn.pri{background:linear-gradient(135deg,#3B82F6,#8B5CF6);color:#fff;border:0;box-shadow:0 8px 20px rgba(80,100,240,.35)}
.bar .tt{font-size:23px;font-weight:720;letter-spacing:-.025em;flex:1}
.srch{position:absolute;left:16px;right:16px;top:114px;height:46px;border-radius:23px;background:var(--card);border:1px solid var(--cardB);box-shadow:var(--cardSh);
  display:flex;align-items:center;gap:10px;padding:0 16px;font-size:15.5px;color:var(--faint)}
.srch .ico{width:18px;height:18px}
.srch b{font-weight:500;color:var(--ink)}
.glist{position:absolute;left:16px;right:16px;top:222px;display:flex;flex-direction:column;gap:12px}
.gsec .hd{display:flex;justify-content:space-between;align-items:center;font-size:14.5px;font-weight:700;color:var(--muted);padding:0 6px;height:26px}
.gsec .hd span{font-weight:600;color:var(--faint);position:relative}
.grow{display:flex;align-items:center;gap:12px;padding:0 14px;height:58px;overflow:hidden}
.grow .ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.grow .ti .ico{width:20px;height:20px}
.grow .t1{font-size:15px;font-weight:650;color:var(--ink);white-space:nowrap;letter-spacing:-.008em}
.grow .t2{font-size:12.5px;color:var(--faint);margin-top:2px;white-space:nowrap}
.grow .chev{margin-left:auto;color:var(--faint)}
.grow .chev .ico{width:16px;height:16px}
.gempty{height:44px;overflow:hidden;display:flex;align-items:center;padding:0 16px;font-size:14px;color:var(--muted)}
.fab{position:absolute;right:16px;bottom:24px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;z-index:14;
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.55));border:1px solid rgba(255,255,255,.95);box-shadow:0 14px 32px rgba(40,50,120,.22)}
.scrim{position:absolute;inset:0;background:rgba(12,16,40,.3);z-index:35}
.asheet{position:absolute;left:0;right:0;bottom:0;border-radius:34px 34px 0 0;z-index:40;color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(244,246,253,.97));box-shadow:0 -20px 60px rgba(10,15,50,.22)}
.asheet .grab{width:40px;height:5px;border-radius:3px;background:rgba(60,60,67,.25);margin:9px auto 0}
.arow{display:flex;align-items:center;gap:13px;height:60px;padding:0 16px}
.arow+.arow{border-top:1px solid rgba(60,60,67,.1)}
.arow .ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.arow .ti .ico{width:20px;height:20px}
.arow .t1{font-size:15.5px;font-weight:650}
.arow .t2{font-size:12.5px;color:var(--faint);margin-top:2px}
.abtn{height:52px;border-radius:26px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;font-size:16px;font-weight:650}
.abtn .ico{width:19px;height:19px}
.box{background:rgba(255,255,255,.75);border:1px solid rgba(60,60,67,.1);border-radius:20px}
.notice{position:absolute;left:16px;right:16px;top:222px;height:43px;border-radius:16px;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:14.5px;font-weight:600;
  background:rgba(16,185,129,.16);color:#047857;z-index:8}
.notice .ico{width:18px;height:18px}

/* schede fuori dal telefono (parte chiara) */
.fcard{position:absolute;border-radius:30px;background:#fff;box-shadow:0 30px 70px rgba(60,50,90,.14),0 4px 12px rgba(60,50,90,.06);color:#1D1D1F}
.fcard .ft{font-size:30px;font-weight:660;letter-spacing:-.025em}
.fcard .fs{font-size:22px;font-weight:500;color:#6E6E73;margin-top:4px;letter-spacing:-.008em}
.pillc{display:inline-flex;align-items:center;gap:8px;font-size:19px;font-weight:650;padding:7px 15px;border-radius:999px;white-space:nowrap}

/* griglia riassuntiva */
.tile{position:absolute;border-radius:38px;background:#161617;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.055)}
.tile .tt{font-size:40px;font-weight:660;letter-spacing:-.035em;line-height:1.08;color:#F5F5F7}
.tile .ts{font-size:21px;font-weight:480;line-height:1.35;color:#A1A1A6;letter-spacing:-.008em;margin-top:9px}
.tile .tic{width:54px;height:54px}
.tile .tic svg{stroke-width:1.6}

/* finale */
.word{font-family:Sora,sans-serif;font-weight:800;font-size:128px;letter-spacing:-.02em;line-height:1}
.urlp{display:inline-flex;align-items:center;gap:12px;font-size:30px;font-weight:560;letter-spacing:-.01em;padding:16px 30px;border-radius:999px;
  background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#F5F5F7;white-space:nowrap}
.urlp .ico{width:26px;height:26px;color:#A1A1A6}
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui"><button id="play">Pausa</button><span id="tm">0.0 s</span><input id="seek" type="range" min="0" max="100" step="0.01" value="0"></div>
<script src="icons.js"></script>
<script src="timeline.js"></script>
<script src="../video-trailer/common.js"></script>
<script src="video.js"></script>
</body>
</html>
