<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AILA — La squadra</title>
<link rel="stylesheet" href="common.css">
<style>
#stage{background:#040508}
/* atmosfera: nebbia, fasci di luce, bande del formato cinema, grana */
.fog{position:absolute;width:1700px;height:1100px;border-radius:50%;left:0;top:0}
.beam{position:absolute;top:-260px;width:520px;height:1600px;transform-origin:50% 0;mix-blend-mode:screen;
  background:linear-gradient(180deg,rgba(220,230,255,.20),rgba(220,230,255,.05) 55%,transparent 80%);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent)}
.lbx{position:absolute;left:0;right:0;height:140px;background:#000;z-index:60}
#grain{position:absolute;inset:0;z-index:70;opacity:.07;mix-blend-mode:overlay;background-size:960px 540px;pointer-events:none}
#vig{position:absolute;inset:0;z-index:58;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7) 100%);pointer-events:none}
.flare{position:absolute;left:-300px;width:2520px;height:5px;z-index:56;mix-blend-mode:screen;border-radius:3px;
  background:linear-gradient(90deg,transparent,rgba(150,185,255,.0) 8%,rgba(215,228,255,1) 50%,rgba(150,185,255,0) 92%,transparent);
  box-shadow:0 0 34px 10px rgba(110,150,255,.55)}

/* tipografia "da presentazione" */
.num{font-weight:800;font-size:780px;line-height:.78;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.17);letter-spacing:-.07em;white-space:nowrap}
.sk{display:inline-block;transform:skewX(-9deg)}
.name{font-weight:800;font-size:210px;line-height:.86;letter-spacing:-.035em;text-transform:uppercase;white-space:nowrap}
.desc{font-size:30px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:#C9D3FF;white-space:nowrap}
.tag{font-size:19px;font-weight:700;letter-spacing:.3em;color:#8C99C8;text-transform:uppercase;white-space:nowrap}
.tag b{color:#fff;font-weight:800}
.stripe{position:absolute;height:20px;clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%)}
.stats{display:flex;gap:56px}
.stat{min-width:220px}
.stat .v{font-size:50px;font-weight:800;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.stat .l{font-size:18px;font-weight:600;color:#9AA6CF;letter-spacing:.14em;text-transform:uppercase;margin-top:12px;line-height:1.35;max-width:300px}
.right .stats{justify-content:flex-end}
.slam{font-size:180px;font-weight:800;letter-spacing:-.045em;text-transform:uppercase;line-height:.9;white-space:nowrap}
.cap{font-size:26px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:#C9D3FF;white-space:nowrap}

/* fotografie "macro" dell'interfaccia: copia nitida al centro, copia sfocata ai bordi */
.macro{position:absolute;inset:0;overflow:hidden}
.macro .shot{position:absolute;left:0;top:0;transform-origin:0 0}
.macro .sharp{-webkit-mask-image:radial-gradient(ellipse 38% 34% at 50% 50%,#000 40%,transparent 100%);mask-image:radial-gradient(ellipse 38% 34% at 50% 50%,#000 40%,transparent 100%)}
.macro .soft{filter:blur(9px) brightness(.7)}

/* semaforo: i sei banchi del logo */
.lamp{position:absolute;width:190px;height:142px;border-radius:48px;background:#141826;border:3px solid #232A40}
.lamp i{position:absolute;inset:0;border-radius:45px;background:linear-gradient(45deg,#6FA8FF,#A78BFA);
  box-shadow:0 0 60px 10px rgba(130,150,255,.75),0 0 160px 40px rgba(120,140,255,.35)}

/* griglia di partenza */
.slot{position:absolute;width:300px;height:12px;background:rgba(255,255,255,.85);border-radius:3px}
.slotn{position:absolute;font-size:64px;font-weight:800;color:rgba(255,255,255,.75);letter-spacing:-.02em}

.qrbox{background:#fff;border-radius:34px;padding:40px;box-shadow:0 30px 90px rgba(0,0,0,.5),0 0 120px rgba(120,140,255,.35)}
.chip{display:inline-flex;align-items:center;gap:12px;font-size:26px;font-weight:600;padding:14px 24px;border-radius:999px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);white-space:nowrap;color:#E6EBFF}
.chip .ico{width:28px;height:28px}
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui"><button id="play">Pausa</button><span id="tm">0.0 s</span><input id="seek" type="range" min="0" max="100" step="0.01" value="0"></div>
<script src="icons.js"></script>
<script src="qr.js"></script>
<script src="intro-timeline.js"></script>
<script src="common.js"></script>
<script src="intro.js"></script>
</body>
</html>
