name: iosApp
options:
  deploymentTarget:
    iOS: "26.0"
  bundleIdPrefix: com.circolareplus

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
    settings:
      PRODUCT_NAME: Circolare+
      PRODUCT_BUNDLE_IDENTIFIER: com.circolareplus
      FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
      OTHER_LDFLAGS: -framework shared
      # shared/build.gradle.kts non dichiara iosX64 (simulatore Mac Intel): Compose Multiplatform
      # ha smesso di pubblicare per quel target. Senza questa esclusione Xcode chiede comunque
      # x86_64 per il simulatore (default ARCHS = arm64 x86_64) e Gradle fallisce con
      # "Xcode Requested Architecture Not Configured in Gradle: ios_x64".
      EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    preBuildScripts:
      - name: Embed and Sign Apple Framework
        script: |
          cd "$SRCROOT/.."
          chmod +x ./gradlew
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
