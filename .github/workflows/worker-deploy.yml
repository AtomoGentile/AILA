name: Worker deploy

# Deploy del Worker Cloudflare, solo a mano (Actions → Worker deploy → Run workflow).
# Secret richiesti: CLOUDFLARE_API_TOKEN (permessi Workers Scripts Edit + D1 Edit),
# CLOUDFLARE_ACCOUNT_ID e WRANGLER_TOML (contenuto intero di backend/wrangler.toml, che non e'
# nel repository: e' in .gitignore e il workflow lo ricrea a ogni lancio). I secret del Worker (JWT_SECRET, GEMINI_API_KEY, FCM...) restano su
# Cloudflare: il deploy non li tocca.
#
# Dalla v1.5.0 il wrangler.toml nel secret deve contenere anche il binding Workers AI:
#   [ai]
#   binding = "AI"
# (routes/ai.ts, chat di AILA Assistant incluso per tutti). Non e' un secret e non costa:
# sul piano Free e' Cloudflare stessa a contare i neuron (10.000/giorno) e bloccare a fine
# quota: la rotta traduce quell'errore in 429.
on:
  workflow_dispatch:
    inputs:
      migrations:
        description: >-
          Migrazioni D1 da applicare PRIMA del deploy, separate da spazi, nell'ordine
          (es. "008_ranking_polls.sql 009_push_preferences.sql"). Vuoto = nessuna.
          Attenzione: quelle con ALTER TABLE falliscono se lanciate due volte.
        required: false
        default: ''
      deploy:
        description: 'Esegui wrangler deploy dopo le migrazioni'
        type: boolean
        default: true

# Un deploy alla volta: due lanci ravvicinati non si sovrappongono.
concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Toglie spazi e "a capo" copiati per sbaglio insieme ai secret (wrangler li rifiuta),
      # poi li rende disponibili ai passi successivi con i nomi che wrangler si aspetta.
      - name: Check secrets
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          token=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          account=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          if [ -z "$token" ] || [ -z "$account" ]; then
            echo "::error::Mancano i secret CLOUDFLARE_API_TOKEN e/o CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      # backend/wrangler.toml non e' nel repository: lo ricostruisce questo passo dal secret.
      - name: Write wrangler.toml
        env:
          WRANGLER_TOML: ${{ secrets.WRANGLER_TOML }}
        run: |
          if [ -z "$WRANGLER_TOML" ]; then
            echo "::error::Manca il secret WRANGLER_TOML (contenuto di backend/wrangler.toml)"
            exit 1
          fi
          printf '%s\n' "$WRANGLER_TOML" > wrangler.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm 10 (quello di Node 22) si ferma con "Cannot read properties of null (reading
      # 'edgesOut')" risolvendo le dipendenze di vitest 4; npm 11 le installa senza problemi.
      # `ci`: esattamente le versioni di backend/package-lock.json, non le ultime uscite.
      - name: Install dependencies
        run: npx -y npm@11 ci --no-audit --no-fund

      # Stesso controllo che si fa in locale: un errore di tipi non arriva in produzione.
      - name: Typecheck
        run: npx tsc --noEmit -p .

      # Test delle rotte su un D1 simulato (SQLite di Node) con lo schema reale: se falliscono
      # non si applicano migrazioni e non si deploya.
      - name: Test
        run: npm test

      # Input passato via env e validato: estrae i nomi dei file .sql (es. "022_telegram_reminders.sql").
      - name: Apply D1 migrations
        if: inputs.migrations != ''
        env:
          MIGRATIONS: ${{ inputs.migrations }}
        run: |
          set -e
          # Estrae i nomi di file .sql validi anche se l'utente ha incollato l'intero comando wrangler
          CLEAN_MIGRATIONS=$(echo "$MIGRATIONS" | grep -oE '[0-9]{3}_[a-z0-9_]+\.sql' | awk '!seen[$0]++' || true)
          if [ -z "$CLEAN_MIGRATIONS" ]; then
            echo "::error::Nessuna migrazione valida trovata nell'input '$MIGRATIONS'. Inserisci solo il nome del file, ad es.: 022_telegram_reminders.sql"
            exit 1
          fi
          for m in $CLEAN_MIGRATIONS; do
            if [ ! -f "migrations/$m" ]; then
              echo "::error::File di migrazione inesistente: migrations/$m"
              exit 1
            fi
          done
          for m in $CLEAN_MIGRATIONS; do
            echo "== Applico $m"
            npx wrangler d1 execute circolare_d1 --remote --file="./migrations/$m"
          done

      - name: Deploy Worker
        if: inputs.deploy
        run: npx wrangler deploy
