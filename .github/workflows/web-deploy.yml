name: PWA deploy

# Compila la PWA (WebAssembly) e la pubblica su Cloudflare Pages, progetto "aila-scuola".
# Le modifiche di main aggiornano il sito stabile; i tag stabili pubblicano in produzione,
# mentre i tag beta aggiornano il branch preview "beta" senza esporre la beta sul sito stabile.
# I pull request eseguono solo la build. L'avvio manuale richiede il tag da compilare.
# Secret richiesti: CLOUDFLARE_API_TOKEN (permesso "Cloudflare Pages: Edit") e
# CLOUDFLARE_ACCOUNT_ID, gli stessi del deploy del Worker se il token ha anche quel permesso.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'shared/**'
      - 'webApp/**'
      - '.github/workflows/web-deploy.yml'
      - 'scripts/prepare_release.py'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    paths:
      - 'shared/**'
      - 'webApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/web-deploy.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag stabile o beta da compilare e distribuire (es. v2.0.0-beta.45)'
        required: true
        type: string

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_PROJECT: aila-scuola
  DIST: webApp/build/dist/wasmJs/productionExecutable

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release tag
        id: release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python3 scripts/prepare_release.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle wrapper and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/nodejs
            ~/.gradle/yarn
          key: ${{ runner.os }}-gradle-web-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-web-

      # Come negli altri workflow: google-services.json non e' nel repository e il plugin del
      # modulo Android lo vuole gia' in fase di configurazione, anche se la PWA non lo usa.
      - name: google-services.json
        run: |
          if [ ! -f androidApp/google-services.json ]; then
            cat > androidApp/google-services.json <<'EOF'
          {
            "project_info": { "project_number": "0", "project_id": "ci-placeholder", "storage_bucket": "ci-placeholder.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:0:android:0000000000000000", "android_client_info": { "package_name": "com.circolareplus" } },
              "api_key": [{ "current_key": "ci-placeholder" }]
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build PWA
        run: ./gradlew --no-daemon :webApp:wasmJsBrowserDistribution

      # Cloudflare Pages accetta file fino a 25 MiB: meglio accorgersene qui che al deploy.
      - name: Check file sizes
        run: |
          find "$DIST" -type f -printf '%s %p\n' | sort -rn | head -8
          big=$(find "$DIST" -type f -size +25M | head -1)
          if [ -n "$big" ]; then
            echo "::error::$big supera i 25 MiB ammessi da Cloudflare Pages"
            exit 1
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: aila-pwa
          path: ${{ env.DIST }}
          retention-days: 7

      # Main updates maintain the stable PWA; beta tags publish to an isolated Pages preview.
      # Deployment credentials are normalized before use, matching the Worker deployment flow.
      - name: Check secrets
        if: github.event_name != 'pull_request'
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          token=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          account=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          if [ -z "$token" ] || [ -z "$account" ]; then
            echo "::error::Mancano i secret CLOUDFLARE_API_TOKEN e/o CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      # Al primo deploy il progetto Pages non esiste ancora: lo si crea.
      - name: Ensure Pages project
        if: github.event_name != 'pull_request'
        run: |
          if ! npx --yes wrangler@4 pages project list | grep -qw "$PAGES_PROJECT"; then
            npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main
          fi

      - name: Deploy stable PWA
        if: (steps.release.outputs.prerelease == 'false' && github.event_name != 'pull_request') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: npx --yes wrangler@4 pages deploy "$DIST" --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true

      - name: Deploy beta PWA preview
        if: steps.release.outputs.prerelease == 'true' && github.event_name != 'pull_request'
        run: npx --yes wrangler@4 pages deploy "$DIST" --project-name="$PAGES_PROJECT" --branch=beta --commit-dirty=true
