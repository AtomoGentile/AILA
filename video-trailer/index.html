<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AILA — Trailer</title>
<link rel="stylesheet" href="common.css">
<style>
/* sfondo */
.blob{position:absolute;width:1300px;height:1300px;border-radius:50%;left:0;top:0}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(170,190,255,.09) 1.2px,transparent 1.3px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay}

/* tipografia */
.slam{font-size:150px;font-weight:800;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.big{font-size:104px;font-weight:700;letter-spacing:-.035em;line-height:1.04}
.h1{font-size:92px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:0}
.sub{font-size:31px;line-height:1.45;font-weight:400;color:var(--muted)}
.label{display:inline-flex;align-items:center;gap:14px;font-size:21px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:#C9D3FF;padding:11px 22px;border-radius:999px;border:1px solid rgba(165,180,252,.35);background:rgba(99,102,241,.14);white-space:nowrap}
.label b{font-weight:800;color:#fff}
.chip{display:inline-flex;align-items:center;gap:12px;font-size:26px;font-weight:600;padding:14px 24px;border-radius:999px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);white-space:nowrap;color:#E6EBFF}
.chip .ico{width:28px;height:28px}

/* notifiche dell'intro */
.notif{width:560px;padding:18px 22px;border-radius:26px;display:flex;gap:16px;align-items:center;
  background:rgba(24,30,56,.86);border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.notif .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none}
.notif .ic .ico{width:28px;height:28px;color:#fff}
.notif .nap{font-size:16px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between}
.notif .nap span{text-transform:none;letter-spacing:0;font-weight:400;color:var(--faint)}
.notif .tx{font-size:22px;font-weight:600;line-height:1.3;margin-top:3px;color:#F1F4FF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* superfici della scena dei temi */
.panel{background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.14);
  border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.opt{position:relative;display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:6px;border:1px solid rgba(255,255,255,.1)}
.opt span{flex:1;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:10px;height:60px;font-size:23px;font-weight:600;color:#C2CBEA}
.opt span .ico{width:24px;height:24px}
.opt .knob{position:absolute;top:6px;bottom:6px;left:6px;border-radius:999px;background:linear-gradient(135deg,#5A8CFF,#8B5CF6);z-index:1;
  box-shadow:0 8px 24px rgba(90,140,255,.45)}
.sw{width:66px;height:66px;border-radius:50%;position:relative}
.sw .ring{position:absolute;inset:-9px;border-radius:50%;border:3px solid #fff}

/* QR */
.qrbox{background:#fff;border-radius:34px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.5),0 0 120px rgba(120,140,255,.35)}

</style>
</head>
<body>
<div id="stage"></div>
<div id="ui"><button id="play">Pausa</button><span id="tm">0.0 s</span><input id="seek" type="range" min="0" max="124" step="0.01" value="0"></div>
<script src="icons.js"></script>
<script src="qr.js"></script>
<script src="timeline.js"></script>
<script src="common.js"></script>
<script src="video.js"></script>
</body>
</html>
