name: iOS Build

on:
  push:
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - '.github/workflows/ios-build.yml'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - '.github/workflows/ios-build.yml'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle wrapper and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Select Xcode with iOS 26 SDK
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          # Firebase (firebase-ios-sdk) e' un pacchetto grosso da risolvere/clonare: senza
          # cache ogni run lo riscarica da zero, aggiungendo diversi minuti.
          key: ${{ runner.os }}-spm-${{ hashFiles('iosApp/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd iosApp
          xcodegen generate

      - name: Find an available iOS simulator
        id: sim
        run: |
          set -e
          # Un dispositivo iPhone gia' creato sul runner, sul runtime iOS 26 (deve essere
          # 26+: FoundationModels non esiste prima). Solo comandi di testo (grep/sed), niente
          # script multi-riga incorporato nel blocco YAML: un python -c multilinea qui dentro
          # aveva rotto la sintassi YAML del workflow (indentazione del blocco letterale).
          UDID=$(xcrun simctl list devices available \
            | sed -n '/^-- iOS 26/,/^--/p' \
            | grep -m1 'iPhone' \
            | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}')
          if [ -z "$UDID" ]; then
            echo "Nessun simulatore iPhone su iOS 26 disponibile sul runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulatore scelto: $UDID"
          xcrun simctl list devices | grep "$UDID"

      - name: Build iOS app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot simulator and smoke-test the app launch
        # "xcrun simctl bootstatus -b" può restare bloccato per ore su alcuni runner (bug
        # noto dei runner macOS ospitati, soprattutto quando xcodebuild ha già avviato da
        # solo il simulatore come parte della build con destinazione concreta): un timeout
        # esplicito trasforma un blocco silenzioso in un fallimento chiaro e veloce, invece
        # di consumare le 6 ore di timeout massimo del job.
        timeout-minutes: 5
        run: |
          set -e
          UDID="${{ steps.sim.outputs.udid }}"
          echo "Stato del simulatore prima del boot:"
          xcrun simctl list devices | grep "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Circolare+.app" -path "*Debug-iphonesimulator*" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Circolare+.app non trovata nella DerivedData"
            exit 1
          fi
          echo "App: $APP_PATH"

          xcrun simctl install "$UDID" "$APP_PATH"

          # "simctl launch" stampa "bundle.id: PID" su stdout. I processi delle app nel
          # simulatore girano come normali processi HOST (macOS), non come job di launchd:
          # il PID stampato qui e' interrogabile direttamente con kill -0 sul runner, senza
          # passare da "simctl spawn ... launchctl list" (che lista servizi di sistema, non
          # le app in foreground, e quindi non trovava mai nulla - falso allarme di crash
          # nella versione precedente di questo step).
          LAUNCH_OUTPUT=$(xcrun simctl launch "$UDID" com.circolareplus)
          echo "$LAUNCH_OUTPUT"
          APP_PID=$(echo "$LAUNCH_OUTPUT" | grep -oE '[0-9]+$')
          if [ -z "$APP_PID" ]; then
            echo "Impossibile leggere il PID dall'output di 'simctl launch'"
            exit 1
          fi

          # Da' all'app qualche secondo per completare l'avvio (init Kotlin/Compose,
          # iniezione dei bridge nativi) prima di controllare se e' ancora viva: e' il
          # controllo piu' diretto che abbiamo per un crash all'avvio senza un Mac vero.
          sleep 8

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "App avviata (PID $APP_PID) e ancora in esecuzione dopo 8s."
          else
            echo "L'app (PID $APP_PID) non risulta piu' in esecuzione: probabile crash all'avvio."
            xcrun simctl spawn "$UDID" log show --predicate 'process == "Circolare+"' --last 1m || true
            exit 1
          fi

          xcrun simctl shutdown "$UDID" || true
