name: iosApp
options:
  deploymentTarget:
    iOS: "26.0"
  bundleIdPrefix: com.circolareplus

packages:
  # Firebase Messaging via Swift Package Manager (non CocoaPods): resta coerente con lo
  # scheletro XcodeGen-only gia' in uso, senza dover generare un .xcworkspace separato.
  # FirebaseMessaging usa FirebaseCore internamente ma FirebaseApp.configure() va chiamato
  # esplicitamente da AppDelegate.swift, quindi serve anche come dipendenza diretta.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  # MLX Swift (Tier 2 AI locale, iPhone senza Apple Intelligence). Le librerie riusabili
  # (MLXLLM/MLXLMCommon) sono state spostate da mlx-swift-examples a questo repo dedicato
  # (confermato con una ricerca web il 20/9/2026; i vecchi URL di mlx-swift-examples restano
  # validi ma puntano qui). `branch: main` invece di un numero di versione perché questo
  # ambiente non ha un Mac per verificare quale tag sia compatibile con Xcode/iOS 26 al momento
  # della build — la prima build reale dovrebbe passare a un tag fisso una volta verificato.
  # DISATTIVATO (21/9/2026): `mlx-swift-lm` su `main` richiede Swift tools 6.3.0 e la risoluzione
  # dei pacchetti falliva ("incompatible tools version") con l'Xcode dei runner GitHub, quindi la
  # CI iOS non arrivava nemmeno a compilare l'app (falliva gia' su tutti i run di main). Il Tier 2
  # MLX e' comunque nascosto (LocalAiModels.ios.kt). Per riattivarlo: togliere i commenti qui e
  # sotto, ed eventualmente fissare un tag compatibile invece di `main`.
  # MLXSwiftLM:
  #   url: https://github.com/ml-explore/mlx-swift-lm
  #   branch: main

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      # GoogleService-Info.plist, quando presente in questa cartella, viene raccolto
      # automaticamente da questo glob come risorsa dell'app (bundle). In CI non c'e'
      # (locale, vedi .gitignore, come google-services.json per Android): xcodegen non
      # fallisce se manca, semplicemente non lo trova e non lo include.
      - path: iosApp
    # XcodeGen RIGENERA questo file a ogni `xcodegen generate` con le sole chiavi di default piu'
    # quelle elencate qui sotto: tutto quello che serve all'app va scritto QUI, non a mano nel
    # plist (prima launch screen, orientamenti e nome "AILA" stavano solo nel file e si perdevano,
    # e sulla home compariva "Circolare+", il PRODUCT_NAME).
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: AILA
        CFBundleName: AILA
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        # Come lo splash Android (windowSplashScreenBackground #0A1330 + marchio AILA).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        # iPhone solo in verticale, come i telefoni Android; iPad libero, come i tablet.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # remote-notification: push silenziosi e content-available (campanella anche senza
        # tocco, preferenze notifiche). fetch: BGAppRefreshTask, il giro in background delle
        # circolari. processing: il task che tiene viva l'analisi sul telefono con l'app in
        # background (BGContinuedProcessingTask). Vedi AppDelegate.swift.
        UIBackgroundModes:
          - remote-notification
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.circolareplus.refresh
          - com.circolareplus.analysis.*
    settings:
      PRODUCT_NAME: Circolare+
      PRODUCT_BUNDLE_IDENTIFIER: com.circolareplus
      FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
      OTHER_LDFLAGS: -framework shared
      # shared/build.gradle.kts non dichiara iosX64 (simulatore Mac Intel): Compose Multiplatform
      # ha smesso di pubblicare per quel target. Senza questa esclusione Xcode chiede comunque
      # x86_64 per il simulatore (default ARCHS = arm64 x86_64) e Gradle fallisce con
      # "Xcode Requested Architecture Not Configured in Gradle: ios_x64".
      EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseCore
      # - package: MLXSwiftLM
      #   product: MLXLLM
      # - package: MLXSwiftLM
      #   product: MLXLMCommon
    preBuildScripts:
      - name: Embed and Sign Apple Framework
        script: |
          cd "$SRCROOT/.."
          chmod +x ./gradlew
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
