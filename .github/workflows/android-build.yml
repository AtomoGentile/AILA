name: Android Build

# Compila il codice Kotlin di :shared e :androidApp per Android. Nessun test a schermo: serve a
# scoprire subito un errore di compilazione, dato che non tutti gli ambienti di sviluppo
# riescono a scaricare le dipendenze da Google Maven.
# Produce anche AILA.apk (release firmato con la chiave debug) come artifact, e lo allega alla
# release sui tag v*.

on:
  push:
    paths:
      - 'shared/**'
      - 'androidApp/**'
      - '.github/workflows/android-build.yml'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    paths:
      - 'shared/**'
      - 'androidApp/**'
      - '.github/workflows/android-build.yml'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: write # solo per allegare l'APK alla release sui tag

# Piu' push ravvicinati sullo stesso ref: conta solo l'ultimo, i run vecchi si fermano invece di
# occupare minuti di Actions su un commit gia' superato.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle wrapper and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # google-services.json non e' nel repository (.gitignore): il plugin Google Services lo
      # richiede per configurare il modulo, quindi in CI se ne scrive uno finto con lo stesso
      # package. Non serve a far funzionare le notifiche, solo a compilare.
      # Se c'e' il secret GOOGLE_SERVICES_JSON (contenuto del file in base64) si usa quello vero:
      # senza, l'APK si installa ma le notifiche push FCM non funzionano.
      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json
          elif [ ! -f androidApp/google-services.json ]; then
            echo "::warning::Secret GOOGLE_SERVICES_JSON assente: APK con google-services.json finto, push FCM disattivate"
            cat > androidApp/google-services.json <<'EOF'
          {
            "project_info": { "project_number": "0", "project_id": "ci-placeholder", "storage_bucket": "ci-placeholder.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:0:android:0000000000000000", "android_client_info": { "package_name": "com.circolareplus" } },
              "api_key": [{ "current_key": "ci-placeholder" }]
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Compile Kotlin (shared + androidApp)
        run: ./gradlew --no-daemon :shared:compileDebugKotlinAndroid :androidApp:compileDebugKotlinAndroid

      # Prima i soli test del motore AI (instradamento, AICore, catalogo): se si rompe qui il
      # passo rosso dice gia' dove guardare, senza cercare nel log di tutti i test di :shared.
      - name: AI engine tests
        run: ./gradlew --no-daemon :shared:testDebugUnitTest --tests 'circolareplus.ai.*'

      # Tutti i test di :shared: resta la verifica completa, anche dopo quelli del motore AI.
      - name: Shared unit tests
        run: ./gradlew --no-daemon :shared:testDebugUnitTest

      # Il report HTML ha lo stack trace di ogni test fallito: nel log di Gradle c'e' solo il nome.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-report
          path: shared/build/reports/tests/
          if-no-files-found: ignore

      # Totali nella pagina del run, letti dai JUnit XML: si vede quanti test sono passati senza
      # aprire il log. Sommati gli attributi dei <testsuite>, un file per classe di test. Scritti
      # anche nel log, che si legge pure da chi non ha accesso alla pagina del run.
      - name: Test summary
        if: always()
        run: |
          dir=shared/build/test-results/testDebugUnitTest
          {
            echo "### Test di :shared"
            if ! ls "$dir"/*.xml >/dev/null 2>&1; then
              echo "Nessun risultato JUnit in \`$dir\`: i test non sono partiti."
            else
              sum() { grep -ho "<testsuite [^>]*" "$dir"/*.xml | grep -o " $1=\"[0-9]*\"" | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}'; }
              tests=$(sum tests); failures=$(sum failures); errors=$(sum errors); skipped=$(sum skipped)
              failed=$((failures + errors))
              echo "| Totali | Passati | Falliti | Saltati |"
              echo "|---|---|---|---|"
              echo "| $tests | $((tests - failed - skipped)) | $failed | $skipped |"
              if [ "$failed" -gt 0 ]; then
                echo
                echo "Falliti:"
                grep -l -E "<(failure|error)" "$dir"/*.xml | xargs -n1 basename | sed 's/^TEST-/- /; s/\.xml$//'
              fi
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Chiave di firma debug stabile (secret ANDROID_DEBUG_KEYSTORE, base64 di debug.keystore):
      # senza, ogni build ha una chiave diversa e per aggiornare l'app va prima disinstallata.
      - name: Debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$ANDROID_DEBUG_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          else
            echo "::warning::Secret ANDROID_DEBUG_KEYSTORE assente: chiave di firma diversa a ogni build"
          fi

      # Release (non debuggabile) firmato con la chiave debug qui sopra: stessa firma delle build
      # di prima, si aggiorna sopra l'app installata, ma gira molto piu' fluido del debug.
      # Chiave di rilascio vera (facoltativa): secret ANDROID_RELEASE_KEYSTORE (base64 del
      # keystore), ANDROID_RELEASE_STORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS,
      # ANDROID_RELEASE_KEY_PASSWORD. Se ci sono, l'APK e' firmato con quella invece che con la
      # chiave debug. Cambiare chiave obbliga a disinstallare l'app: farlo una volta sola, prima
      # del rilascio ufficiale.
      - name: Release keystore
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_RELEASE_KEYSTORE" ]; then
            echo "$ANDROID_RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK (release)
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :androidApp:assembleRelease
          cp androidApp/build/outputs/apk/release/androidApp-release.apk AILA.apk
          ls -lh AILA.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AILA-apk
          path: AILA.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AILA.apk
