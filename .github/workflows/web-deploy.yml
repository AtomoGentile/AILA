name: PWA deploy

# Build, test e deploy della PWA (web/) su Cloudflare Pages, progetto "aila-scuola".
# Parte da solo sui push a main che toccano la PWA o il contratto condiviso col Worker, oppure a
# mano (Actions → PWA deploy → Run workflow). Non tocca gli altri workflow né il Worker.
# Secret richiesti: CLOUDFLARE_API_TOKEN (permesso "Cloudflare Pages: Edit") e
# CLOUDFLARE_ACCOUNT_ID, gli stessi del deploy del Worker se il token ha anche quel permesso.
# Variabile facoltativa: AILA_API_BASE (URL del Worker; vuota = quello di produzione).
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'backend/src/contracts.ts'
      - '.github/workflows/web-deploy.yml'
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: true

env:
  PAGES_PROJECT: aila-scuola

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Come per il Worker: i package-lock.json sono esclusi dal repo (.gitignore).
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      # Typecheck (app + service worker) e build di produzione.
      - name: Build
        env:
          VITE_API_BASE: ${{ vars.AILA_API_BASE }}
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: aila-pwa
          path: web/dist
          retention-days: 7

      # Toglie spazi e "a capo" copiati per sbaglio insieme ai secret (come nel deploy del Worker).
      - name: Check secrets
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          token=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          account=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          if [ -z "$token" ] || [ -z "$account" ]; then
            echo "::error::Mancano i secret CLOUDFLARE_API_TOKEN e/o CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      # Al primo deploy il progetto Pages non esiste ancora: lo si crea.
      - name: Ensure Pages project
        run: |
          if ! npx --yes wrangler@4 pages project list | grep -qw "$PAGES_PROJECT"; then
            npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
